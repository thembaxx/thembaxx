name: Weekly verified release draft
on:
  push:
    branches: [main]
    paths:
      - scripts/draft-project-updates.mjs
      - .github/workflows/weekly-content-draft.yml
  schedule:
    - cron: "43 12 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Draft actual project activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/draft-project-updates.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: weekly-release-content-draft
          path: reports/weekly-release-draft.md
          retention-days: 30

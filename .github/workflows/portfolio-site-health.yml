name: Portfolio site health
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-site-health
  cancel-in-progress: false
jobs:
  check-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public sites and manifests
        run: node .automation/check-sites.mjs
      - name: Preserve production health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-health
          path: site-health/
          retention-days: 14

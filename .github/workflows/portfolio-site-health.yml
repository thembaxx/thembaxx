name: Portfolio site health
on:
  schedule:
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-site-health
  cancel-in-progress: false
jobs:
  check-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-sites.mjs

name: Portfolio site health
on:
  schedule:
    # Every four hours; Actions schedules may be delayed.
    - cron: "17 */4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-site-health
  cancel-in-progress: false
jobs:
  check-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe public sites and record evidence
        run: node scripts/check-sites.mjs
      - name: Store reachability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-health
          path: reports/site-health.json
          if-no-files-found: warn
          retention-days: 14

name: Weekly project intelligence
on:
  schedule:
    - cron: "21 8 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/project-digest.mjs
      - .github/workflows/weekly-project-digest.yml
permissions:
  contents: read
  actions: read
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/project-digest.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-project-digest
          path: automation/reports/project-digest.md
          retention-days: 30

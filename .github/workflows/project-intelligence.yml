name: Weekly project intelligence
on:
  push:
    branches: [main]
    paths:
      - scripts/project-intelligence.mjs
      - scripts/project-digest.mjs
      - .github/workflows/project-intelligence.yml
  schedule:
    - cron: "19 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-project-intelligence
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Aggregate verified GitHub project signals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/project-intelligence.mjs
          node scripts/project-digest.mjs
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-project-intelligence
          path: |
            reports/project-intelligence.json
            automation/reports/project-digest.md
          if-no-files-found: warn
          retention-days: 30

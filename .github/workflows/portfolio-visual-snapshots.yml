name: Portfolio visual snapshots
on:
  schedule:
    - cron: "37 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-visual
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/site-qa" --no-audit --no-fund playwright@1.56.1 pngjs@7.0.0
          "$RUNNER_TEMP/site-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture real production interfaces
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/site-qa/node_modules/playwright
        run: node scripts/capture-sites.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 30

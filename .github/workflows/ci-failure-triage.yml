name: CI failure triage
on:
  workflow_run:
    workflows: ["Portfolio site health", "Portfolio visual snapshots", "Weekly project intelligence"]
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  triage:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: ./.github/workflows/reusable-failure-triage.yml

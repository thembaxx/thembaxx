name: Portfolio visual audit
on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * 2"
permissions:
  contents: read
  actions: read
concurrency:
  group: portfolio-visual-audit
  cancel-in-progress: false
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install screenshot tooling
        run: npm install --prefix .automation --no-save --no-package-lock --ignore-scripts playwright@1.56.1 pngjs@7.0.0 pixelmatch@6.0.0
      - name: Install Chromium
        run: .automation/node_modules/.bin/playwright install --with-deps chromium
      - name: Download prior reviewed snapshot, when available
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          previous="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/site-visual-audit.yml/runs?status=success&per_page=10" --jq '.workflow_runs[0].id // empty' || true)"
          if [ -n "$previous" ] && [ "$previous" != "$GITHUB_RUN_ID" ]; then
            gh run download "$previous" --name site-screenshots --dir site-screenshots-baseline || true
          fi
      - name: Capture genuine production views and compare
        run: node .automation/capture-sites.mjs
      - name: Preserve screenshot and diff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: site-screenshots/
          retention-days: 14
          if-no-files-found: warn
